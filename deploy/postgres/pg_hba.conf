# PostgreSQL host-based authentication for the Docker internal network.
# The replication entry enables physical streaming replication to db_report.
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    replication     all             all                     scram-sha-256
host    all             all             all                     scram-sha-256
